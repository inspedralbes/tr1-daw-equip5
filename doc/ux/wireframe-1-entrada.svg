l='#ffffff' font-weight='bold' text-anchor='middle'>1</text><circle cx='108' cy='300' r='13' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='108' y='305' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>2</text><circle cx='648' cy='205' r='13' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='648' y='210' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>3</text><circle cx='648' cy='562' r='13' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='648' y='567' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>4</text><circle cx='1232' cy='660' r='13' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='1232' y='665' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='14' fill='#ffffff' font-weight='bold' text-anchor='middle'>5</text><rect x='60' y='646' width='760' height='164' rx='8' fill='#eef5fc' stroke='#1f6fb2' stroke-width='1.5' opacity='1'/><text x='74' y='672' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1f6fb2' font-weight='bold' text-anchor='start'>Notas</text><circle cx='84' cy='693' r='10' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='84' y='697' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>1</text><text x='102' y='698' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#2d2d2d' font-weight='normal' text-anchor='start'>Nombre obligatorio (máx. 16 caracteres). Se guarda en el store de usuario (Pinia).</text><circle cx='84' cy='717' r='10' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='84' y='721' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>2</text><text x='102' y='722' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#2d2d2d' font-weight='normal' text-anchor='start'>El color identifica al jugador en el mapa, el panel de tripulación y el vídeo.</text><circle cx='84' cy='741' r='10' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='84' y='745' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>3</text><text x='102' y='746' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#2d2d2d' font-weight='normal' text-anchor='start'>getUserMedia al entrar en la vista; los toggles prueban mic/cámara antes de entrar.</text><circle cx='84' cy='765' r='10' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='84' y='769' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>4</text><text x='102' y='770' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#2d2d2d' font-weight='normal' text-anchor='start'>Si se deniega el permiso o no hay dispositivo, aviso y se entra sin vídeo.</text><circle cx='84' cy='789' r='10' fill='#1f6fb2' stroke='#1f6fb2' stroke-width='2'/><text x='84' y='793' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#ffffff' font-weight='bold' text-anchor='middle'>5</text><text x='102' y='794' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#2d2d2d' font-weight='normal' text-anchor='start'>Al pulsar: client:hello { name, avatar } y navega a /hangar.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>