name: Deploy a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  comprobar:
    name: Comprobar que compila
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Instalar el backend
        working-directory: backend
        run: npm ci

  desplegar:
    name: Desplegar en el servidor
    needs: comprobar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Copiar el proyecto al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose.yml,frontend,backend"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Reconstruir y arrancar los contenedores
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose up -d --build
            docker image prune -f
